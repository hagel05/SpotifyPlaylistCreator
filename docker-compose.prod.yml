version: '3.8'

services:
  app:
    image: ghcr.io/hagel05/cpb:latest
    container_name: cpb-app
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SETLIST_FM_API_KEY: ${SETLIST_FM_API_KEY}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI}
      SERVER_PORT: 30075
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "${FRONTEND_PORT:-30055}:30055"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30075/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
